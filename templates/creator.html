<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge Creator - Python Coding Challenges</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
        }

        .header {
            background: #2d2d30;
            padding: 15px 30px;
            border-bottom: 2px solid #007acc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #007acc;
            font-size: 24px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
            text-decoration: none;
        }

        .btn:hover {
            background: #1177bb;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .form-section {
            background: #2d2d30;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-section h2 {
            color: #007acc;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #9cdcfe;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            color: #d4d4d4;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
            font-family: 'Courier New', monospace;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007acc;
        }

        .test-case-item {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        .test-case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .test-case-number {
            color: #007acc;
            font-weight: bold;
        }

        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            display: block;
            margin: 20px auto 0;
        }

        .btn-add:hover {
            background: #218838;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 4px;
            background: #28a745;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .help-text {
            font-size: 12px;
            color: #858585;
            margin-top: 5px;
        }

        .challenges-list {
            background: #2d2d30;
            border-radius: 8px;
            padding: 30px;
            margin-top: 30px;
        }

        .challenges-list h2 {
            color: #007acc;
            margin-bottom: 20px;
        }

        .challenge-card {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .challenge-info h3 {
            color: #9cdcfe;
            margin-bottom: 8px;
        }

        .challenge-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #858585;
        }

        .difficulty {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        .difficulty.easy {
            background: #28a745;
            color: white;
        }

        .difficulty.medium {
            background: #ffc107;
            color: #000;
        }

        .difficulty.hard {
            background: #dc3545;
            color: white;
        }

        .challenge-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .description-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .preview-panel {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            min-height: 150px;
            overflow-y: auto;
            max-height: 400px;
        }

        .preview-panel h1, .preview-panel h2, .preview-panel h3 {
            color: #9cdcfe;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .preview-panel code {
            background: #2d2d30;
            padding: 2px 6px;
            border-radius: 3px;
            color: #ce9178;
        }

        .preview-panel pre {
            background: #2d2d30;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }

        .preview-panel pre code {
            background: transparent;
            padding: 0;
        }

        .preview-label {
            color: #9cdcfe;
            font-weight: 500;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .description-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-bullseye"></i> Challenge Creator</h1>
        <div class="nav-buttons">
            <a href="/" class="btn"><i class="fas fa-arrow-left"></i> Back to Challenges</a>
        </div>
    </div>

    <div class="container">
        <!-- Challenge Creation Form -->
        <div class="form-section">
            <h2 id="formTitle">Create New Challenge</h2>
            <form id="challengeForm">
                <input type="hidden" id="editingId" value="">
                <div class="form-group">
                    <label for="title">Challenge Title *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., List Comprehension Basics">
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty *</label>
                    <select id="difficulty" name="difficulty" required>
                        <option value="">Select difficulty</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Challenge Description *</label>
                    <div class="description-container">
                        <div>
                            <textarea id="description" name="description" required placeholder="Describe the challenge. Use Markdown formatting if desired."></textarea>
                            <div class="help-text">Supports Markdown. Explain what the user needs to accomplish.</div>
                        </div>
                        <div>
                            <div class="preview-label">Preview:</div>
                            <div class="preview-panel" id="descriptionPreview">Type to see preview...</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Test Cases *</label>
                    <div id="testCasesContainer"></div>
                    <button type="button" class="btn-add" onclick="addTestCase()">+ Add Test Case</button>
                    <div class="help-text">Add at least one test case to validate solutions</div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Challenge</button>
                    <button type="button" class="btn btn-danger" onclick="resetForm()"><i class="fas fa-redo"></i> Reset Form</button>
                </div>
            </form>
        </div>

        <!-- Custom Challenges List -->
        <div class="challenges-list">
            <h2>Your Custom Challenges</h2>
            <div id="customChallenges">
                <p style="color: #858585; text-align: center;">No custom challenges yet. Create one above!</p>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <script>
        let testCaseCounter = 0;

        // Initialize with one test case
        window.addEventListener('DOMContentLoaded', () => {
            addTestCase();
            loadCustomChallenges();
        });

        function addTestCase() {
            testCaseCounter++;
            const container = document.getElementById('testCasesContainer');
            const testCaseDiv = document.createElement('div');
            testCaseDiv.className = 'test-case-item';
            testCaseDiv.id = `testCase${testCaseCounter}`;
            
            testCaseDiv.innerHTML = `
                <div class="test-case-header">
                    <span class="test-case-number">Test Case #${testCaseCounter}</span>
                    <button type="button" class="btn-remove" onclick="removeTestCase(${testCaseCounter})"><i class="fas fa-times"></i> Remove</button>
                </div>
                <div class="form-group">
                    <label>Input</label>
                    <textarea name="input_${testCaseCounter}" rows="2" placeholder="e.g., [1, 2, 3, 4, 5] or leave empty for None"></textarea>
                </div>
                <div class="form-group">
                    <label>Expected Output *</label>
                    <textarea name="output_${testCaseCounter}" rows="2" required placeholder="e.g., [1, 4, 9, 16, 25]"></textarea>
                </div>
            `;
            
            container.appendChild(testCaseDiv);
        }

        function removeTestCase(id) {
            const testCase = document.getElementById(`testCase${id}`);
            if (testCase) {
                testCase.remove();
            }
        }

        function resetForm() {
            if (confirm('Are you sure you want to reset the form? All unsaved changes will be lost.')) {
                document.getElementById('challengeForm').reset();
                document.getElementById('editingId').value = '';
                document.getElementById('formTitle').textContent = 'Create New Challenge';
                document.getElementById('testCasesContainer').innerHTML = '';
                document.getElementById('descriptionPreview').textContent = 'Type to see preview...';
                testCaseCounter = 0;
                addTestCase();
            }
        }

        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification' + (isError ? ' error' : '');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Markdown preview
        document.getElementById('description').addEventListener('input', (e) => {
            const preview = document.getElementById('descriptionPreview');
            if (e.target.value.trim()) {
                preview.innerHTML = marked.parse(e.target.value);
            } else {
                preview.textContent = 'Type to see preview...';
            }
        });

        document.getElementById('challengeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Collect form data
            const formData = new FormData(e.target);
            const title = formData.get('title');
            const difficulty = formData.get('difficulty');
            const description = formData.get('description');
            const editingId = document.getElementById('editingId').value;
            
            // Collect test cases
            const testCases = [];
            const testCaseElements = document.querySelectorAll('.test-case-item');
            
            testCaseElements.forEach((element) => {
                const id = element.id.replace('testCase', '');
                const input = formData.get(`input_${id}`);
                const output = formData.get(`output_${id}`);
                
                if (output) {
                    testCases.push({
                        input: input || null,
                        expected: output,
                        description: `Test case ${testCases.length + 1}`
                    });
                }
            });
            
            if (testCases.length === 0) {
                showNotification('Please add at least one test case', true);
                return;
            }
            
            // Create challenge object
            const challenge = {
                title: title,
                difficulty: difficulty,
                description: description,
                solution: '',  // No longer asking for solution
                test_cases: testCases
            };
            
            try {
                const isEditing = editingId !== '';
                const url = isEditing ? `/api/challenges/custom/${editingId}` : '/api/challenges/create';
                const method = isEditing ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(challenge)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showNotification(isEditing ? '✅ Challenge updated successfully!' : '✅ Challenge created successfully!');
                    resetForm();
                    loadCustomChallenges();
                } else {
                    showNotification('❌ Error: ' + (result.error || 'Failed to save challenge'), true);
                }
            } catch (error) {
                showNotification('❌ Error: ' + error.message, true);
            }
        });

        async function loadCustomChallenges() {
            try {
                const response = await fetch('/api/challenges/custom');
                const challenges = await response.json();
                
                const container = document.getElementById('customChallenges');
                
                if (challenges.length === 0) {
                    container.innerHTML = '<p style="color: #858585; text-align: center;">No custom challenges yet. Create one above!</p>';
                    return;
                }
                
                container.innerHTML = challenges.map(challenge => `
                    <div class="challenge-card">
                        <div class="challenge-info">
                            <h3>${escapeHtml(challenge.title)}</h3>
                            <div class="challenge-meta">
                                <span class="difficulty ${challenge.difficulty.toLowerCase()}">${challenge.difficulty}</span>
                                <span>ID: ${challenge.id}</span>
                                <span>${challenge.test_cases.length} test case${challenge.test_cases.length !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                        <div class="challenge-actions">
                            <button class="btn btn-small" onclick="viewChallenge(${challenge.id})"><i class="fas fa-eye"></i> View</button>
                            <button class="btn btn-small" onclick="editChallenge(${challenge.id})" style="background: #ffc107; color: #000;"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteChallenge(${challenge.id})"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading challenges:', error);
            }
        }

        function viewChallenge(id) {
            window.location.href = `/?challenge=${id}`;
        }

        async function editChallenge(id) {
            try {
                const response = await fetch(`/api/challenges/custom/${id}`);
                const challenge = await response.json();
                
                if (response.ok) {
                    // Populate form
                    document.getElementById('editingId').value = challenge.id;
                    document.getElementById('formTitle').textContent = 'Edit Challenge';
                    document.getElementById('title').value = challenge.title;
                    document.getElementById('difficulty').value = challenge.difficulty;
                    document.getElementById('description').value = challenge.description;
                    
                    // Update preview
                    document.getElementById('descriptionPreview').innerHTML = marked.parse(challenge.description);
                    
                    // Clear and populate test cases
                    document.getElementById('testCasesContainer').innerHTML = '';
                    testCaseCounter = 0;
                    
                    challenge.test_cases.forEach(tc => {
                        addTestCase();
                        const currentId = testCaseCounter;
                        document.querySelector(`textarea[name="input_${currentId}"]`).value = tc.input || '';
                        document.querySelector(`textarea[name="output_${currentId}"]`).value = tc.expected || '';
                    });
                    
                    // Scroll to form
                    document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
                } else {
                    showNotification('❌ Error loading challenge', true);
                }
            } catch (error) {
                showNotification('❌ Error: ' + error.message, true);
            }
        }

        async function deleteChallenge(id) {
            if (!confirm('Are you sure you want to delete this challenge? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/challenges/custom/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showNotification('✅ Challenge deleted successfully!');
                    loadCustomChallenges();
                } else {
                    showNotification('❌ Error: ' + (result.error || 'Failed to delete challenge'), true);
                }
            } catch (error) {
                showNotification('❌ Error: ' + error.message, true);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
