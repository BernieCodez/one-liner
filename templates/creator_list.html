<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Challenges - Py1iner Coding Challenges</title>
    <link rel="icon" type="image/x-icon" href="/static/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/static/favicons/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/creator_list.css">
</head>
<body>
    <div class="header">
        <a href="/" style="text-decoration: none; display: flex; align-items: center;">
            <h1 style="color: #FFD343; margin: 0;"> Py</h1> <h1 style="color: #3672a5; margin: 0;"> 1iner</h1>
        </a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <h1 style="margin: 0; color: #d4d4d4; font-size: 24px;"><i class="fas fa-bullseye"></i> My Challenges</h1>
        </div>
        <div class="nav-buttons">
            <a href="/" class="btn"><i class="fas fa-home"></i> Home</a>
            <a href="/challenges" class="btn"><i class="fas fa-code"></i> Challenges</a>
        </div>
    </div>

    <div class="container">
        <div class="challenges-header">
            <div class="header-info">
                <h2>Your Custom Challenges</h2>
                <p class="subtitle">Create, edit, and manage your custom coding challenges</p>
            </div>
            <a href="/creator/new" class="btn btn-create">
                <i class="fas fa-plus"></i> Create New Challenge
            </a>
        </div>

        <div id="customChallenges" class="challenges-grid">
            <!-- Challenges will be loaded here -->
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-lightbulb"></i>
            <h3>No Challenges Yet</h3>
            <p>Start creating your first custom challenge!</p>
            <a href="/creator/new" class="btn btn-create-large">
                <i class="fas fa-plus"></i> Create Your First Challenge
            </a>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <script>
        // Load custom challenges on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadCustomChallenges();
        });

        async function loadCustomChallenges() {
            try {
                const response = await fetch('/api/challenges/custom');
                const challenges = await response.json();
                
                const container = document.getElementById('customChallenges');
                const emptyState = document.getElementById('emptyState');
                
                if (challenges.length === 0) {
                    container.style.display = 'none';
                    emptyState.style.display = 'flex';
                    return;
                }
                
                container.style.display = 'grid';
                emptyState.style.display = 'none';
                
                container.innerHTML = challenges.map(challenge => `
                    <div class="challenge-card">
                        <div class="challenge-header">
                            <h3 class="challenge-title">${escapeHtml(challenge.title)}</h3>
                            <span class="difficulty difficulty-${challenge.difficulty.toLowerCase()}">${challenge.difficulty}</span>
                        </div>
                        <div class="challenge-meta">
                            <span><i class="fas fa-hashtag"></i> ID: ${challenge.id}</span>
                            <span><i class="fas fa-vial"></i> ${challenge.test_cases.length} test case${challenge.test_cases.length !== 1 ? 's' : ''}</span>
                            ${challenge.solvable_in_one_line ? '<span class="one-liner-badge"><i class="fas fa-bolt"></i> One-liner</span>' : ''}
                        </div>
                        <div class="challenge-description">
                            ${getPreviewText(challenge.description)}
                        </div>
                        <div class="challenge-actions">
                            <button class="btn btn-view" onclick="viewChallenge(${challenge.id})">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="btn btn-edit" onclick="editChallenge(${challenge.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-delete" onclick="deleteChallenge(${challenge.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading challenges:', error);
                showNotification('❌ Error loading challenges', true);
            }
        }

        function getPreviewText(markdown) {
            // Simple preview - strip markdown and get first 120 chars
            const text = markdown
                .replace(/#{1,6}\s/g, '') // Remove headers
                .replace(/\*\*(.+?)\*\*/g, '$1') // Remove bold
                .replace(/\*(.+?)\*/g, '$1') // Remove italic
                .replace(/`(.+?)`/g, '$1') // Remove code
                .replace(/\[(.+?)\]\(.+?\)/g, '$1') // Remove links
                .replace(/```[\s\S]*?```/g, '') // Remove code blocks
                .trim();
            
            return text.length > 120 ? text.substring(0, 120) + '...' : text;
        }

        function viewChallenge(id) {
            window.location.href = `/challenges?challenge=${id}`;
        }

        function editChallenge(id) {
            window.location.href = `/creator/edit/${id}`;
        }

        async function deleteChallenge(id) {
            if (!confirm('Are you sure you want to delete this challenge? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/challenges/custom/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showNotification('✅ Challenge deleted successfully!');
                    loadCustomChallenges();
                } else {
                    showNotification('❌ Error: ' + (result.error || 'Failed to delete challenge'), true);
                }
            } catch (error) {
                showNotification('❌ Error: ' + error.message, true);
            }
        }

        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification' + (isError ? ' error' : '');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
