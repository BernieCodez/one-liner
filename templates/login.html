<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Py1iner Challenges</title>
    <link rel="icon" type="image/x-icon" href="/static/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/static/favicons/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <i class="fas fa-code"></i>
            <h1>Py1iner</h1>
            <p>Master Python with challenging one-liners</p>
        </div>

        <div class="tab-container">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <!-- Login Form -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="login-username" name="username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" name="password" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">
                    Login
                </button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="form-container">
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signup-username" name="username" required autocomplete="username" minlength="3">
                    </div>
                    <div class="password-requirements">At least 3 characters</div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signup-password" name="password" required autocomplete="new-password" minlength="4">
                    </div>
                    <div class="password-requirements">At least 4 characters</div>
                </div>
                <button type="submit" class="submit-btn" id="signup-btn">
                    Create Account
                </button>
            </form>
        </div>

        <div class="features">
            <h3>What you'll get:</h3>
            <div class="feature-list">
                <div class="feature-item">
                    <i class="fas fa-trophy"></i>
                    <span>Track your progress and solved challenges</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-save"></i>
                    <span>Save your solutions automatically</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-plus-circle"></i>
                    <span>Create and manage custom challenges</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update forms
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            document.getElementById(tab + '-form').classList.add('active');

            // Clear messages
            hideMessages();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('success-message').classList.remove('show');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.classList.add('show');
            document.getElementById('error-message').classList.remove('show');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }

        function setButtonLoading(buttonId, isLoading) {
            const button = document.getElementById(buttonId);
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading-spinner"></span>Processing...';
            } else {
                button.disabled = false;
                button.innerHTML = buttonId === 'login-btn' ? 'Login' : 'Create Account';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();
            setButtonLoading('login-btn', true);

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    showError(data.error || 'Login failed');
                    setButtonLoading('login-btn', false);
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                setButtonLoading('login-btn', false);
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            hideMessages();
            setButtonLoading('signup-btn', true);

            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    showError(data.error || 'Signup failed');
                    setButtonLoading('signup-btn', false);
                }
            } catch (error) {
                showError('Connection error. Please try again.');
                setButtonLoading('signup-btn', false);
            }
        }

        // Handle Enter key on tab buttons
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    tab.click();
                }
            });
        });
    </script>
</body>
</html>
